[project]
name = "bb-sim"
version = "0.1.0"
description = "Drive BracketBot's balance and manipulation policies in MuJoCo, no robot required."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==19.0.1",
    "glfw==2.10.2",
    "mujoco==3.8.1",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "pillow==12.3.0",
    "pyarrow==25.0.1",
    "pyopengl==3.1.10",
    "scipy==1.18.1",
]

[project.scripts]
bbsim = "bbsim.cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bbsim"
module-root = ""
